<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Pay - Live Financial Demo</title>
    <style>
        :root {
            --primary: #2563eb; --primary-dark: #1d4ed8; --success: #10b981;
            --danger: #ef4444; --warning: #f59e0b; --bg: #f3f4f6; --text: #1f2937;
            --gray: #6b7280; --border: #e5e7eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .app-container {
            background: #ffffff; width: 100%; max-width: 400px; height: 850px; max-height: 90vh;
            border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); overflow: hidden;
            border: 8px solid #111827; position: relative; display: flex; flex-direction: column;
        }

        .header { background: var(--primary); color: white; padding: 20px; padding-top: 30px; }
        .header h1 { font-size: 20px; font-weight: 800; }
        .header p { font-size: 12px; opacity: 0.9; margin-top: 4px; }

        .content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 80px; }
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { background: #f9fafb; padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        .stat-label { font-size: 11px; color: var(--gray); text-transform: uppercase; font-weight: 600; }
        .stat-value { font-size: 22px; font-weight: 800; margin-top: 5px; color: var(--text); }
        .stat-value.green { color: var(--success); }
        .stat-value.red { color: var(--danger); }

        .section-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        
        .list-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px; background: #f9fafb; border-radius: 10px; margin-bottom: 10px; 
            border: 1px solid var(--border); cursor: pointer; transition: 0.2s;
        }
        .list-item:active { background: #f3f4f6; }
        .item-info h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .item-info p { font-size: 11px; color: var(--gray); }
        .financials { font-size: 11px; margin-top: 6px; display: flex; gap: 10px; }
        .fin-paid { color: var(--success); font-weight: 600; }
        .fin-balance { color: var(--danger); font-weight: 600; }
        
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 10px; font-weight: 700; }
        .badge-paid { background: #d1fae5; color: #065f46; }
        .badge-partial { background: #fef3c7; color: #92400e; }
        .badge-unpaid { background: #fee2e2; color: #991b1b; }

        .search-bar {
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px;
            font-size: 14px; outline: none; margin-bottom: 15px; background: #f9fafb;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--gray); margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); margin-top: 10px; }

        .bottom-nav {
            position: absolute; bottom: 0; width: 100%; background: white;
            border-top: 1px solid var(--border); display: flex; justify-content: space-around;
            padding: 12px 0; padding-bottom: 20px;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--gray); font-size: 10px; font-weight: 600; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 20px; margin-bottom: 4px; }

        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 24px; border-radius: 20px; width: 85%; text-align: center; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Fixed Pay</h1>
        <p>Rubaga Junior School • Term 2, 2026</p>
    </div>

    <div class="content">
        <!-- VIEW 1: DASHBOARD -->
        <div id="view-dashboard" class="view active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Students</div>
                    <div class="stat-value" id="stat-total">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Fully Paid</div>
                    <div class="stat-value green" id="stat-paid">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Outstanding Bal</div>
                    <div class="stat-value red" id="stat-balance">0 UGX</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Collected</div>
                    <div class="stat-value green" id="stat-collected">0 UGX</div>
                </div>
            </div>
            <div class="section-title">Recent Activity</div>
            <div id="recent-activity-list"></div>
        </div>

        <!-- VIEW 2: STUDENTS -->
        <div id="view-students" class="view">
            <div class="section-title"><span>Student Registry</span></div>
            <input type="text" class="search-bar" id="search-students" placeholder="🔍 Search by name or code..." onkeyup="renderRegistry()">
            <div id="full-student-list"></div>
        </div>

        <!-- VIEW 3: PAYMENTS -->
        <div id="view-payments" class="view">
            <div class="section-title"><span>Collect Payments</span></div>
            <p style="font-size: 12px; color: var(--gray); margin-bottom: 15px;">Tap a student to process payment.</p>
            <div id="payment-list"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchView('dashboard', this)"><div class="nav-icon">📊</div><span>Dashboard</span></div>
        <div class="nav-item" onclick="switchView('students', this)"><div class="nav-icon"></div><span>Students</span></div>
        <div class="nav-item" onclick="switchView('payments', this)"><div class="nav-icon">💸</div><span>Payments</span></div>
    </div>

    <!-- PAYMENT MODAL -->
    <div class="modal" id="payModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 5px;">Process Payment</h3>
            <p style="font-size: 12px; color: var(--gray); margin-bottom: 15px;" id="modal-student-info"></p>
            <div class="form-group" style="text-align: left;">
                <label>Amount to Pay (UGX)</label>
                <input type="number" id="pay-amount" placeholder="e.g. 150000">
            </div>
            <button class="btn btn-primary" onclick="confirmPayment()">Confirm & Send MoMo Prompt</button>
            <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<script>
    // --- LIVE DATABASE ---
    const STANDARD_FEE = 500000;
    let students = [
        { id: 1, name: "Musa Kato", class: "P.4", code: "RJS-P4-001", phone: "0772123456", totalFee: STANDARD_FEE, paid: 0 },
        { id: 2, name: "Jane Akello", class: "P.6", code: "RJS-P6-042", phone: "0701987654", totalFee: STANDARD_FEE, paid: 500000 },
        { id: 3, name: "Peter Okello", class: "P.2", code: "RJS-P2-045", phone: "0753111222", totalFee: STANDARD_FEE, paid: 200000 },
        { id: 4, name: "Sarah Nambi", class: "P.2", code: "RJS-P2-012", phone: "0772999888", totalFee: STANDARD_FEE, paid: 500000 },
        { id: 5, name: "David Ochieng", class: "P.5", code: "RJS-P5-088", phone: "0701555444", totalFee: STANDARD_FEE, paid: 100000 }
    ];
    let currentPayId = null;

    // --- HELPERS ---
    const formatMoney = (amount) => new Intl.NumberFormat('en-UG').format(amount) + ' UGX';
    const getStatus = (s) => s.paid >= s.totalFee ? 'Paid' : (s.paid > 0 ? 'Partial' : 'Unpaid');
    const getBalance = (s) => Math.max(0, s.totalFee - s.paid);

    // --- NAVIGATION ---
    function switchView(viewName, navElement) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + viewName).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        navElement.classList.add('active');
        renderAll(); // Refresh data when switching tabs
    }

    // --- RENDER FUNCTIONS ---
    function renderAll() {
        renderDashboard();
        renderRegistry();
        renderPaymentList();
    }

    function renderDashboard() {
        const total = students.length;
        const paidCount = students.filter(s => getStatus(s) === 'Paid').length;
        const totalCollected = students.reduce((sum, s) => sum + s.paid, 0);
        const totalBalance = students.reduce((sum, s) => sum + getBalance(s), 0);

        document.getElementById('stat-total').innerText = total;
        document.getElementById('stat-paid').innerText = paidCount;
        document.getElementById('stat-collected').innerText = formatMoney(totalCollected);
        document.getElementById('stat-balance').innerText = formatMoney(totalBalance);

        // Recent Activity (Last 3)
        const recent = students.slice(-3).reverse();
        document.getElementById('recent-activity-list').innerHTML = recent.map(s => `
            <div class="list-item" style="cursor: default;">
                <div class="item-info">
                    <h4>${s.name} - ${s.class}</h4>
                    <p>${s.paid > 0 ? 'Paid ' + formatMoney(s.paid) : 'No payment yet'}</p>
                </div>
                <span class="badge badge-${getStatus(s).toLowerCase()}">${getStatus(s).toUpperCase()}</span>
            </div>
        `).join('');
    }

    function renderRegistry() {
        const query = document.getElementById('search-students').value.toLowerCase();
        const filtered = students.filter(s => s.name.toLowerCase().includes(query) || s.code.toLowerCase().includes(query));
        
        document.getElementById('full-student-list').innerHTML = filtered.map(s => `
            <div class="list-item" style="cursor: default;">
                <div class="item-info">
                    <h4>${s.name} - ${s.class}</h4>
                    <p>Code: ${s.code}</p>
                    <div class="financials">
                        <span class="fin-paid">Paid: ${formatMoney(s.paid)}</span>
                        <span class="fin-balance">Bal: ${formatMoney(getBalance(s))}</span>
                    </div>
                </div>
                <span class="badge badge-${getStatus(s).toLowerCase()}">${getStatus(s).toUpperCase()}</span>
            </div>
        `).join('');
    }

    function renderPaymentList() {
        const pending = students.filter(s => getBalance(s) > 0);
        document.getElementById('payment-list').innerHTML = pending.map(s => `
            <div class="list-item" onclick="openPayModal(${s.id})">
                <div class="item-info">
                    <h4>${s.name} - ${s.class}</h4>
                    <p>Code: ${s.code} • Balance: ${formatMoney(getBalance(s))}</p>
                </div>
                <span class="badge badge-unpaid">COLLECT</span>
            </div>
        `).join('');
    }

    // --- PAYMENT LOGIC ---
    function openPayModal(id) {
        const student = students.find(s => s.id === id);
        currentPayId = id;
        document.getElementById('modal-student-info').innerText = `${student.name} (${student.class}) | Balance: ${formatMoney(getBalance(student))}`;
        document.getElementById('pay-amount').value = getBalance(student); // Auto-fill balance
        document.getElementById('payModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('payModal').style.display = 'none';
        currentPayId = null;
    }

    function confirmPayment() {
        const amount = parseInt(document.getElementById('pay-amount').value);
        if (!amount || amount <= 0) { alert('Enter a valid amount'); return; }

        const student = students.find(s => s.id === currentPayId);
        student.paid += amount;
        if (student.paid > student.totalFee) student.paid = student.totalFee; // Cap at total fee

        closeModal();
        alert(`✅ Payment Successful!\n\n${formatMoney(amount)} received for ${student.name}.\nDigital receipt sent to ${student.phone}.\nRegistry updated.`);
        renderAll(); // Live update the UI
    }

    // Initialize
    renderAll();
</script>

</body>
</html>
